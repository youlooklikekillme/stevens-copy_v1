# Весь Stevens одной командой: docker compose up --build
# Откройте http://localhost:8081 (или 8080 — тот же фронт): прототип по контракту v1.4 с допами.
# Бэк в этой ветке переделан под контракт, поэтому старый frontend/ здесь не собирается.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    container_name: voice_assistant_db
    environment:
      POSTGRES_DB: taskapp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - voice_assistant_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d taskapp"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/taskapp
      YANDEX_API_KEY: ${YANDEX_API_KEY:-}
      YANDEX_FOLDER_ID: ${YANDEX_FOLDER_ID:-}
      # Удалять песочницы, в которые не заходили N дней (по умолчанию 30, 0 — не удалять)
      STEVENS_SANDBOX_DAYS: ${STEVENS_SANDBOX_DAYS:-30}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend-contract:
    build:
      context: ./frontend-contract
      args:
        VITE_API_URL: ""
    restart: unless-stopped
    ports:
      - "8081:80"
      - "8080:80"
    depends_on:
      - backend

volumes:
  voice_assistant_pg_data:
